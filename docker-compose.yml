# docker-compose.yml — Simple Task Manager (local dev / build-from-source)
#
# For x-server production deployment, use docker-compose.prod.yml (pulls the
# prebuilt image from GHCR; see that file for the production flow).
#
# This file builds the image locally — useful for testing changes before
# pushing to main (CI then builds the same Dockerfile and ships via GHCR).
#
# Build: DOCKER_BUILDKIT=0 docker compose up -d --build
# Logs:  docker compose logs -f stm

services:
  stm:
    build:
      context: .
      dockerfile: Dockerfile
      # x-server's default bridge has no MASQUERADE (iptables: false in daemon.json);
      # build needs docker_management to reach npm/composer/apk over the network.
      network: docker_management
    image: stm:latest
    container_name: stm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # SQLite + any future user-generated content
      - stm-db:/var/www/html/database
      # Application logs (handy for `docker exec` triage; not strictly required)
      - stm-storage:/var/www/html/storage
    networks:
      docker_management:
        ipv4_address: 172.18.0.91
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  stm-db:
  stm-storage:

networks:
  docker_management:
    external: true
