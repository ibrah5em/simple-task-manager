name: build-and-deploy

# Builds the multi-stage Dockerfile and publishes the image to GHCR on every
# push to main. Watchtower on x-server (label-scoped to com.centurylinklabs.watchtower.enable=true)
# polls the registry and rolls the stm container when :latest changes — there
# is no explicit "deploy" step in this workflow.
#
# Image: ghcr.io/ibrah5em/stm
# Tags:  latest          (always — what Watchtower follows)
#        sha-<short-sha> (immutable, for rollback / pinning)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stm
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
