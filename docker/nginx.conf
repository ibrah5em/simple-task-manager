user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Security headers (CSP intentionally omitted — app uses inline scripts/styles
        # from Bootstrap, FullCalendar, etc. Add a tuned CSP in a later pass.)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;

        # Health check (Laravel's /up route)
        location = /up {
            try_files $uri /index.php?$query_string;
        }

        # Hashed Vite assets — long-lived cache
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Static assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri /index.php?$query_string;
        }

        # Front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Block dotfiles except .well-known (ACME)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
